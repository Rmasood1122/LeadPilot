[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpilot"
version = "0.1.0"
description = "LeadPilot - self-learning client acquisition system (backend core)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tenacity>=8.3",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.23",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: architecture tripwires -- module layout and public interfaces",
]

[tool.ruff]
line-length = 100
target-version = "py311"
