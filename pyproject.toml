[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpilot"
version = "0.1.0"
description = "LeadPilot - self-learning client acquisition system (backend core)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tenacity>=8.3",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    # structlog is imported UNCONDITIONALLY by app/core/logging.py, which six
    # app/api/* modules import, which app.main imports. It was never declared,
    # so `pip install .` in the Dockerfile never installed it and
    # `import app.main` raised ModuleNotFoundError inside the production image
    # — the API could not boot in ANY container, Railway included. It only
    # worked locally because dev machines had it from somewhere else.
    "structlog>=24.1",
    # typer + rich back app/cli/create_admin.py, which DEPLOY_RAILWAY.md's
    # first-deploy sequence tells you to run inside the container.
    "typer>=0.12",
    "rich>=13.7",
    # Feature 5, the shareable ROI proof card. These are declared HERE and not
    # only in requirements.txt because the Dockerfile installs `pip install .`
    # -- exactly the gap that left structlog out of every production image
    # (see the note above it).
    #
    # WeasyPrint renders app/templates/roi_card.html; it emits PDF only since
    # v53, so pypdfium2 rasters the page to PNG. WeasyPrint additionally needs
    # system Pango, installed in the Dockerfile. Pillow backs the fallback
    # renderer that runs when any of that is unavailable, so the endpoint
    # always returns an image (see app/services/roi_card.py).
    "weasyprint>=60.0",
    "pypdfium2>=4.25",
    "jinja2>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.23",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

# The ROI proof card template is not a .py file, so `pip install .` would
# otherwise drop it and app/services/roi_card.py would fall back to the Pillow
# renderer in any deployment that runs from the INSTALLED package rather than
# from the source tree.
[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: architecture tripwires -- module layout and public interfaces",
]

[tool.ruff]
line-length = 100
target-version = "py311"
