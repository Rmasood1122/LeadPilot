# Curated synonym groups for help-center retrieval (app/services/help_center.py).
#
# HOW THEY ARE USED
# Query-side only. When a question contains ANY term of a group (single word
# or multi-word phrase), every other term of that group is added to the query
# at half weight. Documents are never rewritten, so a chunk that uses the
# user's own word still outranks one that only uses a synonym.
#
# Terms are normalised exactly like the index (lowercase, punctuation dropped,
# simple plural stripping), so list the singular form once.
#
# WHAT BELONGS HERE
# Words users type that the articles phrase differently. Not spelling
# corrections for one golden question, and not anything that would make an
# off-topic question look on-topic: tests/help_center measures both directions
# (recall@6 on answerable questions and mock-mode precision on must-refuse
# ones), so a careless group shows up as a failing test, not as quieter harm.
groups:
  - [price, cost, pricing, fee, how much, paid]
  - [plan, tier, subscription]
  - [billing, payment, invoice, charge, card, checkout, stripe]
  - [gmail, google mail, google account, google workspace, inbox, email account, mailbox]
  - [cancel, unsubscribe from plan, end subscription, downgrade]
  - [stop, pause, halt, freeze, kill switch]
