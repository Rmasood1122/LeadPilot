version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Exposed on the host so the test suite can reach it from outside the
    # compose network. 6380 rather than 6379 to avoid colliding with a
    # Redis already running on the host.
    ports:
      - "6380:6379"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-min-32-chars}
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-min-32-chars}
    volumes:
      - media:/app/media
    # -Q must list every queue in celery_app.conf.task_routes. Without it this
    # worker consumes only the implicit "celery" queue and processes nothing.
    command: celery -A app.workers.celery_app worker -Q pipeline,outreach,learning,default --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

  beat:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-min-32-chars}
    volumes:
      - media:/app/media
    command: celery -A app.workers.celery_app beat --loglevel=info


volumes:
  pgdata:
  media:
