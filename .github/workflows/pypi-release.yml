name: SDK — PyPI Release

# Triggered by: git push origin release/sdk-v1.0.0
# Steps: build → TestPyPI publish → smoke test (clean venv) → PyPI publish
# On any failure: workflow stops, nothing is published to PyPI.

on:
  push:
    tags:
      - "release/sdk-v*"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the distribution
  # ---------------------------------------------------------------------------
  build:
    name: Build SDK distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution
        run: twine check dist/*

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#release/sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-${{ steps.version.outputs.VERSION }}
          path: sdk/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Publish to TestPyPI (staging)
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # for Trusted Publishing (OIDC)

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TWINE_TOKEN_TESTPYPI }}

  # ---------------------------------------------------------------------------
  # 3. Smoke test — clean virtualenv, no repo access, published package only
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke test (TestPyPI install)
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#release/sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Install from TestPyPI (clean venv — no repo access)
        run: |
          python -m venv smoke_env
          source smoke_env/bin/activate
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            clienthunter==${{ steps.version.outputs.VERSION }}

      - name: Run CLI smoke test
        run: |
          source smoke_env/bin/activate
          clienthunter version
          clienthunter --help

  # ---------------------------------------------------------------------------
  # 4. Publish to PyPI (production) — only after smoke test passes
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TWINE_TOKEN_PYPI }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SDK v${{ github.ref_name }}"
          body: |
            ## clienthunter SDK release

            Install:
            ```bash
            pip install clienthunter==${{ github.ref_name }}
            ```

            See [CHANGES.md](CHANGES.md) for what changed in this release.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
