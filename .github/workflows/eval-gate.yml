name: eval-gate
# LeadPilot release gate (eval-conductor consumer-3, the last one).
# This is also the repo's FIRST test CI: 1,985 offline tests existed and
# never ran on push before this workflow.
# Doctrine: never pipe a gating command's output on the same line as anything
# that consumes its exit code; every gate step reads the exit code directly.
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt fakeredis pyyaml pytest pytest-asyncio pytest-mock
      - name: Registry schema lint (hard block)
        run: python3 evals/tools/registry_lint.py evals/registry.yaml
      - name: Produce candidate (run the 1,985-test offline suite, junit-scored)
        run: python3 evals/run_evals.py
      - name: Gate (candidate vs baseline)
        run: python3 evals/tools/promote.py
      - name: Seen-it-fire — every hard gate proven to BLOCK
        run: python3 evals/fixtures/verify_block_fixtures.py
      - name: Live-fire — deleted-compliance-file attack must BLOCK end to end
        run: |
          python3 evals/run_evals.py --sabotage compliance --from-junit out_evals/junit.xml --out /tmp/sabotage_candidate.json
          set +e
          python3 evals/tools/promote.py --candidate /tmp/sabotage_candidate.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "FATAL: sabotaged candidate got exit $code, want 1 (BLOCK) — gate is decoration"
            exit 1
          fi
          echo "gate BLOCKED the deleted-compliance-file attack (exit 1) — proven live on this commit"
