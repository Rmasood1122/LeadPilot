# Golden questions for the Help AI (STAR_PROMPT A.4, 2.5).
#
# answerable   real questions a user could type, with the chunk ids that
#              answer them (`expected`; ANY one in the top 6 is a hit).
#              `style` is paraphrase | typo | short | non_native | starter
#              (starter = the questions GET /support/faq offers in the widget). Written from
#              the user's side first, then mapped to the article sections that
#              answer them -- not tuned to the retriever. A chunk id is
#              `<article-id>#<heading-slug>`; when a heading changes, the
#              recall test fails with the stale id, which is intended.
# must_refuse  questions the assistant must NOT answer from the corpus.
#              expected_path: "refusal" (off-topic: the REFUSAL constant) or
#              "ticket" (about LeadPilot but not in the corpus: the ticket
#              suggestion -- never an invented price, policy or promise).
#
# Used by tests/help_center/test_retrieval_eval.py (offline, every CI run)
# and scripts/help_center/live_eval.py (opt-in, real key, never in CI).
